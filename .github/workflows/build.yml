name: Build Module

# Builds the LSPosed module APK on every push/PR and produces a signed,
# installable artifact. A GitHub Release with the APK is created when a tag
# matching v* is pushed.
#
# The module uses AGP 9.1.1 + Gradle 9.3.1 + compileSdk 37 + JDK 17. AGP 9.1.1
# is the minimum version that understands the fractional SDK platform format
# (platforms;android-37.0) Google introduced for API 36+: those platforms carry
# a dotted <api-level> (e.g. 37.0/37.2) that AGP 8.x's sdklib cannot parse, so
# it fails with "Failed to find target with hash string 'android-37'".
# The `compatible` build type is minified and debug-signed (installable on its
# own) so the pipeline needs no release keystore. To publish a release-signed
# APK instead, drop a PKCS12 keystore into signing-private/ locally or provide
# KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / KEYSTORE_PASSWORD secrets and
# build `assembleRelease`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          # API 37 ships only in the fractional form (platforms;android-37.0).
          # AGP 9.1.1 parses that format natively and compiles against it for
          # compileSdk = 37, so no package.xml/source.properties rewriting is
          # needed here (AGP 8.x needed a full metadata rewrite and still failed).
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;36.0.0" "platforms;android-37.0"
          echo "sdk.dir=$SDK" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build compatible APK
        run: ./gradlew --no-daemon assembleCompatible

      # AGP 9.x only creates unit-test variants for debuggable build types, and
      # the `compatible` variant sets isDebuggable=false, so the shared src/test
      # suite runs under the debug variant (it is variant-independent).
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-purifier-compatible
          path: app/build/outputs/apk/compatible/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/compatible/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
