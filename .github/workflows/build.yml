name: Build Module

# Builds the LSPosed module APK on every push/PR and produces a signed,
# installable artifact. A GitHub Release with the APK is created when a tag
# matching v* is pushed.
#
# The module uses AGP 8.12 + compileSdk 37 + JDK 17. The `compatible` build
# type is minified and debug-signed (installable on its own) so the pipeline
# needs no release keystore. To publish a release-signed APK instead, drop a
# PKCS12 keystore into signing-private/ locally or provide KEYSTORE_BASE64 /
# KEY_ALIAS / KEY_PASSWORD / KEYSTORE_PASSWORD secrets and build `assembleRelease`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;35.0.0"
          yes | sdkmanager --licenses
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build compatible APK
        run: ./gradlew --no-daemon assembleCompatible

      - name: Run unit tests (compatible)
        run: ./gradlew --no-daemon testCompatibleUnitTest

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-purifier-compatible
          path: app/build/outputs/apk/compatible/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/compatible/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
