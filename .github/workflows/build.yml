name: Build Module

# Builds the LSPosed module APK on every push/PR and produces a signed,
# installable artifact. A GitHub Release with the APK is created when a tag
# matching v* is pushed.
#
# The module uses AGP 8.12 + compileSdk 37 + JDK 17. The `compatible` build
# type is minified and debug-signed (installable on its own) so the pipeline
# needs no release keystore. To publish a release-signed APK instead, drop a
# PKCS12 keystore into signing-private/ locally or provide KEYSTORE_BASE64 /
# KEY_ALIAS / KEY_PASSWORD / KEYSTORE_PASSWORD secrets and build `assembleRelease`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0"
          # Android 16+ SDK platforms carry a minor suffix (e.g. android-37.2);
          # bare "platforms;android-37" is no longer resolvable, so pick the
          # newest 37.x available and fall back to 37.2 if the index is offline.
          LATEST_37=$("$SDK/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE 'platforms;android-37\.[0-9]+' | grep -v beta | sort -V | tail -1)
          [ -z "$LATEST_37" ] && LATEST_37="platforms;android-37.2"
          echo "Resolved platform: $LATEST_37"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "$LATEST_37"
          # AGP 8.x resolves compileSdk 37 to platforms/android-37. The new SDK
          # lays the platform out as platforms/android-37.2 (minor suffix), but
          # the real blocker is that its source.properties ships
          # `AndroidVersion.ApiLevel=37.2` (a dotted value) which AGP 8.12's
          # AndroidVersion parser cannot read as an integer, so the platform is
          # never registered as API 37 ("Failed to find target with hash string
          # 'android-37'"). Copy it into a real android-37 directory and
          # normalize ApiLevel to a plain integer so AGP accepts it.
          INSTALLED=$(ls "$SDK/platforms" | grep -E '^android-37(\.|$)' | head -1)
          if [ -n "$INSTALLED" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            cp -a "$SDK/platforms/$INSTALLED" "$SDK/platforms/android-37"
            sed -i 's/^AndroidVersion\.ApiLevel=.*/AndroidVersion.ApiLevel=37/' \
              "$SDK/platforms/android-37/source.properties"
            echo "Prepared platforms/android-37 (ApiLevel normalized from $INSTALLED)"
          fi
          echo "sdk.dir=$SDK" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build compatible APK
        run: ./gradlew --no-daemon assembleCompatible

      - name: Run unit tests (compatible)
        run: ./gradlew --no-daemon testCompatibleUnitTest

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-purifier-compatible
          path: app/build/outputs/apk/compatible/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/compatible/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
